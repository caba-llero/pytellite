name: Intermediate axis instability
simulation:
  dt_sim: 0.1
  time_scale: 100.0
  mode: SIL
  rng_seed: 12345
  t_final: 5.0
  # Precomputation defaults for GUI playback
  t_max: 50.0
  playback_speed: 1.0
  sample_rate: 30.0
  rtol: 1.0e-12
  atol: 1.0e-12

spacecraft:
  mass: 10.0
  inertia: [3000,2000,1000]
  shape: [3, 2, 1]

sensors:
  gps:
    rate_hz: 1.0
    sigma_pos_m: 5.0
    sigma_vel_mps: 0.5
  gyro:
    rate_hz: 100.0
    sigma_radps: 0.001
    bias_rw_sigma: 0.00001

actuators:
  reaction_wheels:
    max_torque: 0.01
    max_speed_rpm: 6000
    inertia: 0.001

perturbations:
  two_body: true
  j2: false
  jn: false
  sun_moon: false
  srp: false
  drag: false

comms:
  protocol: udp
  udp:
    plant_to_flight_port: 10001
    flight_to_plant_port: 10002

watchdog:
  timeout_sec: 1.0

logging:
  replay_file: logs/replay.ndjson

# Default control parameters
control:
  control_type: none # none | tracking (inertial pointing)
  kp: 0.0
  kd: 0.0
  qc: [0.0, 0.0, 0.0, 1.0]

estimation:
  enable_estimation: false
  rng_seed: 42
  gt_freq: 1.0
  gyro_meas_freq: 100.0
  star_meas_freq: 1.0
  ctrl_freq: 1.0
  gyro_arw: 3.0e-6
  gyro_rrw: 3.0e-9
  star_iso_acc: 3.0e-5
  star_init_acc: 0.0
  gyro_true_bias: 5.0e-7
  gyro_est_bias: 5.0e-7
  gyro_init_cov: 1.0e-12
  attitude_init_cov: 9.0e-10

initial_conditions:
  # ~500 km circular orbit around Earth, ECI position on x-axis.
  r_eci_m: [6871000.0, 0.0, 0.0]
  v_eci_mps: [0.0, 7610.0, 0.0]

  # Initial attitude can be specified wrt the orbit frame or the inertial frame.
  # Use the 'frame' parameter to choose.
  frame: 'inertial' # 'orbit' or 'inertial'

  # Orbit frame initial conditions
  # q_ob: quaternion from orbit frame to body frame.
  # A 45 deg rotation over the x-axis.
  q_ob: [0.38268, 0.0, 0.0, 0.92388]
  # omega_bo_radps: angular velocity of body wrt orbit frame, in body frame [rad/s]
  omega_bo_radps: [0.2, -0.1, 0.3]

  # Inertial frame initial conditions
  q_bi: [0, 0, 0, 1]
  omega_bi_radps: [0.01, 5, 0.01]

  # Orbit elements for UI defaults
  orbit:
    epoch_utc_fractional_yydoy: 25258.5000  # YYDDD.DDDD (2025-09-15 12:00 UTC)
    keplerian:
      semi_major_axis_km: 7078.0
      eccentricity: 0.0010
      inclination_deg: 97.4
      raan_deg: 0.0
      argument_of_the_perigee_deg: 90.0
      true_anomaly_deg: 0.0




