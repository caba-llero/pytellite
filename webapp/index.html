<!DOCTYPE html>
<html>
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XNKBLJZQLQ"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);} 
        gtag('js', new Date());
        gtag('config', 'G-XNKBLJZQLQ');
    </script>
    <title>Pytellite</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="container">
        <div id="left-panel">
            <div id="logo-row">
                <img src="/logo.png" alt="Logo" id="site-logo">
                <button id="config-btn" class="config-btn" type="button">Change config</button>
            </div>
            <div id="view-toggle" class="view-toggle" role="group" aria-label="View toggle">
                <button class="toggle-segment active" data-view="attitude" aria-pressed="true">Attitude</button>
                <button class="toggle-segment" data-view="orbit" aria-pressed="false">Orbit</button>
            </div>
            <div class="tabs" role="tablist">
                <button class="tab active" data-tab="units" role="tab" aria-selected="true">Units</button>
                <button class="tab" data-tab="plots" role="tab" aria-selected="false">Plots</button>
                <button class="tab" data-tab="other" role="tab" aria-selected="false">Other</button>
            </div>
            <div class="panels">
                <section class="tab-panel active" data-tab="units" role="tabpanel">
                    <div class="unit-selectors">
                        <div class="unit-row">
                            <label for="timeUnitSelect">Time</label>
                            <select id="timeUnitSelect">
                                <option value="s" selected>seconds</option>
                                <option value="m">minutes</option>
                                <option value="h">hours</option>
                            </select>
                        </div>
                        <div class="unit-row">
                            <label for="angleUnitSelect">Angle</label>
                            <select id="angleUnitSelect">
                                <option value="rad" selected>rad</option>
                                <option value="deg">degree</option>
                            </select>
                        </div>
                        <div class="unit-row">
                            <label for="omegaUnitSelect">Angular velocity</label>
                            <select id="omegaUnitSelect">
                                <option value="rad" selected>rad/s</option>
                                <option value="deg">deg/s</option>
                                <option value="rad_h">rad/h</option>
                                <option value="deg_h">deg/h</option>
                            </select>
                        </div>
                        <div class="unit-row">
                            <label for="momentumUnitSelect">Angular momentum</label>
                            <select id="momentumUnitSelect">
                                <option value="nms" selected>N·m·s</option>
                            </select>
                        </div>
                    </div>
                </section>
                <section class="tab-panel" data-tab="plots" role="tabpanel">
                    <div class="plot-mode-selector" role="group" aria-label="Plot display mode">
                        <label class="plot-mode-option">
                            <input type="radio" name="plotMode" value="ground_truth" checked>
                            <span>Ground truth</span>
                        </label>
                        <label class="plot-mode-option">
                            <input type="radio" name="plotMode" value="estimate_errors" id="estimate_errors_radio">
                            <span>Estimation errors</span>
                        </label>
                        <label class="plot-mode-option">
                            <input type="radio" name="plotMode" value="pointing_error" disabled>
                            <span>Pointing error</span>
                        </label>
                        <label class="plot-mode-option">
                            <input type="radio" name="plotMode" value="gyro_bias" disabled>
                            <span>Gyro bias</span>
                        </label>
                    </div>
                </section>
                <section class="tab-panel" data-tab="other" role="tabpanel">
                    <div id="metrics" style="margin-top:8px;font-size:12px;color:#cfd8e3;line-height:1.4"></div>
                </section>
            </div>
        </div>
        <div id="main-vis">
            <div id="renderer-container"></div>
            <div class="floating-legend" id="floating-legend" aria-live="polite">
                <div id="legend-content" class="legend-content"></div>
                <div class="legend-instructions">Rotate view and zoom with mouse</div>
            </div>
            <div id="orbit-status" class="orbit-status" hidden>Orbit functionality under construction</div>
            <div id="playerControls" class="player-controls">
                <button id="playPauseBtn" class="play-pause-btn" aria-label="Play/Pause">
                    <svg class="icon icon-play" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                        <path fill="currentColor" d="M8 5v14l11-7z"/>
                    </svg>
                    <svg class="icon icon-pause" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                        <path fill="currentColor" d="M6 5h4v14H6zm8 0h4v14h-4z"/>
                    </svg>
                </button>
                <input type="range" id="timelineSlider" class="timeline-slider" value="0" min="0" max="1000" step="1">
                <div id="timeLabel" class="time-label">00:00 / 00:00</div>
            </div>
        </div>
        <div id="plots-container">
            <div id="groundTruthPlots" class="plot-column plot-section">
                <div id="quatPlot" class="plot-wrapper"></div>
                <div id="omegaPlot" class="plot-wrapper"></div>
                <div id="hPlot" class="plot-wrapper"></div>
            </div>
            <div id="errorPlots" class="plot-column plot-section hidden">
                <div id="rotErrPlot" class="plot-wrapper"></div>
                <div id="biasErrPlot" class="plot-wrapper"></div>
            </div>
            <div id="pointingErrorPlots" class="plot-column plot-section hidden">
                <div id="pointingErrorPlot" class="plot-wrapper"></div>
            </div>
            <div id="gyroBiasPlots" class="plot-column plot-section hidden">
                <div id="gyroBiasXPlot" class="plot-wrapper"></div>
                <div id="gyroBiasYPlot" class="plot-wrapper"></div>
                <div id="gyroBiasZPlot" class="plot-wrapper"></div>
            </div>
        </div>
    </div>

    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="/static/script.js"></script>
</body>
</html>
